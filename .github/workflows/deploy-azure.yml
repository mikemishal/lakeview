name: Deploy Lakeview to Azure App Service

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  AZURE_WEBAPP_NAME: lakeview-prod
  NODE_VERSION: "22"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Build Next.js app
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
          NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
          NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: /
          NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: /onboarding
          SIGNUP_INVITE_CODE: ${{ secrets.SIGNUP_INVITE_CODE }}

      - name: Create standalone deployment package
        run: |
          rm -rf deploy
          mkdir -p deploy
      
          # Important: copy dotfiles/folders too, including .next from standalone
          cp -a .next/standalone/. deploy/
      
          # Add public static assets generated by Next
          mkdir -p deploy/.next
          cp -a .next/static deploy/.next/static
      
          if [ -d public ]; then
            cp -a public deploy/public
          fi
      
          cp -a prisma deploy/prisma
      
          cat > deploy/package.json << 'EOF'
          {
            "name": "lakeview-standalone",
            "version": "0.1.0",
            "private": true,
            "scripts": {
              "start": "node server.js"
            }
          }
          EOF
      
          echo "Deployment package contents:"
          ls -la deploy
          echo ".next contents:"
          ls -la deploy/.next

      - name: Zip deployment package
        run: |
          cd deploy
          zip -r ../lakeview-standalone.zip .

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: lakeview-standalone.zip
